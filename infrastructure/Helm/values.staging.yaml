replicaCount: 1
deploymentStrategy: RollingUpdate

image:
  repository: pellerex/RepoUniqueNormalisedIdentifier
  pullPolicy: Always
  tag: "v1.0.0"

env:
  - name: "ENVIRONMENT"
    value: "staging"
  - name: "PORT"
    value: "<port-number>"
  - name: "GIN_MODE"
    value: "release"
  - name: "LOG_LEVEL"
    value: "info"

global:
  envValuesFrom:
    Runtime__IpAddress: status.podIP

secretProviderClass:
  enabled: <secret-provider-class-enabled>

volumes:
  - name: RepoUniqueNormalisedIdentifier-keyvault-volume
    csiSecretProviderClass: RepoUniqueNormalisedIdentifier-api-vault

volumeMounts:
  - name: RepoUniqueNormalisedIdentifier-keyvault-volume
    readOnly: true
    mountPath: /mnt/secrets-store

# Writable emptyDir for the daily-rolling file sinks (must match config.{env}.json
# file_directory). emptyDir is ephemeral — files complement stdout/App Insights,
# they are not the durable store.
logging:
  directory: /var/log/app

# OpenTelemetry Collector sidecar — delivers OTLP (traces/metrics/logs) to Azure
# Application Insights. This is the App Insights leg for Go (no in-process AI SDK,
# GO-D7). To use a shared cluster gateway instead of a per-pod sidecar, set
# enabled=false and point OTEL_EXPORTER_OTLP_ENDPOINT (env) at the gateway service.
otelCollector:
  enabled: true
  # Tag verified against Docker Hub 2026-07-15 (0.115.0 no longer exists there).
  image: "otel/opentelemetry-collector-contrib:0.156.0"
  connectionString: "<azure-app-insights-connection-string-in-staging>"
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

imagePullSecrets:
  - name: image-pull-secret
nameOverride: ""
fullnameOverride: "<managed-service-name>"

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: <port-number>

resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
