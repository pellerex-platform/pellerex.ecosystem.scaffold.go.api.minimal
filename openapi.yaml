# Root API spec — the Pellerex Standards scan checks /openapi.yaml (repo root) for its
# HasApiSpec maturity signal. Keep this in sync with the handlers under handlers/.
openapi: 3.0.3
info:
  title: RepoUniqueNormalisedIdentifier
  description: Pellerex managed API (Go / Gin minimal scaffold).
  version: 1.0.0
servers:
  - url: http://localhost:<port-number>
paths:
  /health/startup:
    get:
      summary: Startup probe
      tags: [Health]
      responses:
        "200":
          description: The first health test has finished, whatever it found.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/HealthAnswer"
        "503":
          description: The first health test has not finished yet.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/HealthAnswer"
  /health/live:
    get:
      summary: Liveness probe
      tags: [Health]
      responses:
        "200":
          description: The last health test passed.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/HealthAnswer"
        "503":
          description: The last health test failed, or none has finished yet. The reason is in the log only.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/HealthAnswer"
  /health/ready:
    get:
      summary: Readiness probe
      tags: [Health]
      responses:
        "200":
          description: The last health test passed.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/HealthAnswer"
        "503":
          description: The last health test failed, or none has finished yet. The reason is in the log only.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/HealthAnswer"
  /v1/hello:
    get:
      summary: Sample endpoint proving config + secret wiring
      tags: [Sample]
      responses:
        "200":
          description: Sample response. Reports only WHETHER the database secret was read — never the value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
components:
  schemas:
    HealthAnswer:
      type: string
      enum: [Healthy, Unhealthy]
    HelloResponse:
      type: object
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        environment:
          type: string
        score:
          type: integer
        configuration:
          type: object
          additionalProperties: true
        dbConnectionStringConfigured:
          type: boolean
